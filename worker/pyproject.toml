[project]
name = "url-shortener-worker"
version = "0.1.0"
description = "Aggregates link click events into daily statistics."
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.2",
]

[project.scripts]
stats-worker = "stats_worker.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "testcontainers[postgres]>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stats_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
