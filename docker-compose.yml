# Banco local para desenvolvimento: docker compose up -d
# As credenciais abaixo são só para a máquina local, nunca para produção.
name: url-shortener

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: urlshortener
      POSTGRES_PASSWORD: urlshortener
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urlshortener -d urlshortener"]
      interval: 5s
      timeout: 3s
      retries: 10

  stats-worker:
    build: ./worker
    environment:
      DATABASE_URL: postgresql://urlshortener:urlshortener@postgres:5432/urlshortener
      INTERVAL_SECONDS: "10"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
